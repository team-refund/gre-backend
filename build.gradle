plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.teamrefund'
version = '0.0.1-SNAPSHOT'

// 컴파일과 테스트에 사용할 JDK 버전
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def mybatisVersion = '4.1.0'

dependencies {
    // Spring MVC API, 외부 HTTP 호출, 요청 데이터 검증
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 인증·인가 및 OAuth2 클라이언트
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // JDBC, MyBatis 매퍼 및 PostgreSQL 드라이버
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"
    runtimeOnly 'org.postgresql:postgresql'

    // Spring AI 버전 관리, OpenAI 채팅·임베딩, pgvector 벡터 저장소
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.3')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // 컴파일 시 Lombok 코드 생성 및 로컬 개발용 DevTools
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 기능별 테스트 지원 및 JUnit 실행 환경
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Java 소스와 테스트에 Google Java Style 적용
spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.30.0')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
