spring.application.name=gre-backend

spring.config.import=optional:file:.env[.properties]

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n

# PostgreSQL connection settings supplied by the runtime environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.ai.openai.api-key=${OPENAI_API_KEY}

# 정책 검토에 사용할 OpenAI 채팅 모델
spring.ai.openai.chat.model=gpt-6-luna
spring.ai.openai.chat.reasoning-effort=none
spring.ai.openai.chat.max-completion-tokens=4096

spring.ai.vectorstore.pgvector.table-name=policy_vector_store
spring.ai.vectorstore.pgvector.initialize-schema=false

# 임베딩 모델
spring.ai.openai.embedding.model=text-embedding-3-large
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=none

mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml

gre.gmail.oauth.client-id=${GOOGLE_CLIENT_ID:}
gre.gmail.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
gre.gmail.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/gmail/oauth2/callback}
gre.gmail.token-encryption-key=${GRE_GMAIL_TOKEN_ENCRYPTION_KEY:}
gre.dev.test-login-enabled=${GRE_DEV_TEST_LOGIN_ENABLED:true}
